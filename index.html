<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Склад за плодове и зеленчуци</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <div>
                <p class="subtitle">
                    Изчисляване на заявката
                </p>

                <h1>Склад</h1>
            </div>

            <div class="date-block">
                <label for="workDate">
                    Дата
                </label>

                <input
                    type="date"
                    id="workDate"
                >
            </div>
        </header>

        <section class="info-box">
            <strong>Как се попълва:</strong>

            <span>
                Натисни полето „Необходимо“ и въведи:
                20+30+12+11
            </span>
        </section>

        <section class="card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="product-column">
                                Продукт
                            </th>

                            <th>
                                Остатък
                            </th>

                            <th>
                                Необходимо
                            </th>

                            <th>
                                За поръчка
                            </th>
                        </tr>
                    </thead>

                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        </section>

        <section class="bottom-panel">
            <div class="total">
                Общо за поръчка:

                <strong id="totalOrder">
                    0 кг
                </strong>
            </div>

            <div class="bottom-actions">
                <button
                    id="clearButton"
                    class="clear-button"
                    type="button"
                >
                    Изчисти
                </button>

                <button
                    id="calculateButton"
                    type="button"
                >
                    Изчисли
                </button>
            </div>
        </section>
    </main>

    <!-- Долен прозорец за въвеждане -->
    <div
        id="expressionModal"
        class="modal"
        aria-hidden="true"
    >
        <div class="modal-backdrop"></div>

        <section
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalProductName"
        >
            <div
                id="sheetHandle"
                class="sheet-handle"
                aria-hidden="true"
            ></div>

            <div class="modal-header">
                <div>
                    <p class="modal-label">
                        Необходимо количество
                    </p>

                    <h2 id="modalProductName">
                        Продукт
                    </h2>
                </div>

                <button
                    id="closeModalButton"
                    class="modal-close"
                    type="button"
                    aria-label="Затвори"
                >
                    ×
                </button>
            </div>

            <label
                class="expression-label"
                for="expressionInput"
            >
                Количества от заявките
            </label>

            <textarea
                id="expressionInput"
                class="expression-input"
                rows="1"
                inputmode="decimal"
                enterkeyhint="done"
                autocomplete="off"
                placeholder="Например: 20+30+12+11"
            ></textarea>

            <div class="expression-preview">
                <span>Общо</span>

                <strong id="expressionTotal">
                    0 кг
                </strong>
            </div>

            <p
                id="expressionError"
                class="expression-error"
                aria-live="polite"
            ></p>

            <button
                id="saveExpressionButton"
                class="save-expression-button"
                type="button"
            >
                Готово
            </button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
