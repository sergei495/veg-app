<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад и Заявки - Плодове и Зеленчуци</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .item-selected {
            ring: 2px;
            ring-color: #059669;
            border-color: #10b981 !important;
            background-color: #f0fdf4 !important;
        }
    </style>
</head>
<body class="p-3 md:p-6 text-gray-800 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="bg-emerald-700 p-5 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-carrot"></i> Инвентар & Заявки
                </h1>
                <p class="text-xs text-emerald-100 mt-1">Автоматично сумиране & Облачна синхронизация</p>
            </div>
            <button onclick="openConfigModal()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1.5 backdrop-blur-sm">
                <i class="fa-solid fa-cloud"></i> Облак настройки
            </button>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs px-4 py-2 flex justify-between items-center">
            <span><i class="fa-solid fa-signal mr-1"></i> Статус: <strong id="statusText">Офлайн (Само локално)</strong></span>
            <button onclick="loadItems()" class="text-amber-900 hover:underline font-semibold flex items-center gap-1">
                <i class="fa-solid fa-rotate"></i> Опресни
            </button>
        </div>

        <!-- Input Form -->
        <div class="p-4 md:p-6 bg-slate-50 border-b border-gray-200">
            <h2 class="text-sm font-semibold text-gray-600 mb-3 uppercase tracking-wider">Добави или промени позиция</h2>
            <form id="addForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Тип</label>
                        <select id="productType" class="w-full px-2 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white font-medium">
                            <option value="warehouse">🏭 Склад</option>
                            <option value="drive">🚚 Ехать</option>
                        </select>
                    </div>
                    <div class="md:col-span-5">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Продукт (напр. Гъби)</label>
                        <input type="text" id="productName" required placeholder="Продукт / Стока" 
                            class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Количество</label>
                        <input type="number" id="productQty" step="any" required placeholder="0" 
                            class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Тара / Опаковка</label>
                        <select id="productUnit" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                            <option value="kaca">kaca (каси)</option>
                            <option value="kg">kg (килограми)</option>
                            <option value="кашон">кашон</option>
                            <option value="палет">палет</option>
                            <option value="торба">торба</option>
                            <option value="брой">брой</option>
                            <option value="пакет">пакет</option>
                            <option value="мрежа">мрежа</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow-md flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-plus"></i> Добави / Добави към сумата
                </button>
            </form>
        </div>

        <!-- Detailed List -->
        <div class="p-4 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-semibold text-gray-600 uppercase tracking-wider">Списък по записи</h2>
                <span id="itemCount" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-medium">0 позиции</span>
            </div>

            <div id="itemsList" class="space-y-2">
                <!-- Items list rendered here -->
            </div>
        </div>

    </div>

    <!-- Modal Config -->
    <div id="configModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-cloud text-emerald-600"></i> Supabase Настройки
                </h3>
                <button onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Supabase URL</label>
                <input type="text" id="cfgUrl" placeholder="https://your-project.supabase.co" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Supabase Anon Key</label>
                <textarea id="cfgKey" rows="3" placeholder="eyJhbGciOi..." class="w-full px-3 py-2 border rounded-lg text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeConfigModal()" class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded-lg">Отказ</button>
                <button onclick="saveConfig()" class="px-4 py-1.5 text-xs bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Запази</button>
            </div>
        </div>
    </div>

    <!-- Modal Quick Action -->
    <div id="quickModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-xs w-full p-5 shadow-2xl">
            <h3 id="quickModalTitle" class="font-bold text-gray-800 text-base mb-1">Промени количество</h3>
            <p id="quickModalSubtitle" class="text-xs text-gray-500 mb-4"></p>
            <input type="number" id="quickModalQty" step="any" placeholder="Количество (напр. 2)" class="w-full px-3 py-2 border rounded-lg mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeQuickModal()" class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded-lg">Отказ</button>
                <button onclick="applyQuickAction()" class="px-4 py-1.5 text-xs bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Потвърди</button>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let items = [];
        let activeItemId = null;
        let activeMode = 'add';
        let selectedIndex = -1;

        window.onload = function() {
            initSupabase();
            loadItems();
            setInterval(loadItems, 3000);
            setupKeyboardNavigation();
        };

        function setupKeyboardNavigation() {
            const nameInput = document.getElementById('productName');
            const qtyInput = document.getElementById('productQty');
            const unitInput = document.getElementById('productUnit');
            const addForm = document.getElementById('addForm');

            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    qtyInput.focus();
                }
            });

            qtyInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    unitInput.focus();
                }
            });

            unitInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                }
            });

            document.addEventListener('keydown', function(e) {
                const quickModalOpen = !document.getElementById('quickModal').classList.contains('hidden');
                const configModalOpen = !document.getElementById('configModal').classList.contains('hidden');

                if (quickModalOpen && e.key === 'Enter') {
                    e.preventDefault();
                    applyQuickAction();
                    return;
                }

                if (quickModalOpen && e.key === 'Escape') {
                    closeQuickModal();
                    return;
                }

                if (configModalOpen) return;

                const isInputFocused = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);

                if (!isInputFocused) {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (items.length === 0) return;
                        selectedIndex = (selectedIndex + 1) % items.length;
                        renderList();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (items.length === 0) return;
                        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                        renderList();
                    } else if (e.key === ' ' && selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        toggleItemOrdered(items[selectedIndex].id);
                    } else if ((e.key === '+' || e.key === '=') && selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        openQuickModal(items[selectedIndex].id, 'add');
                    } else if ((e.key === '-' || e.key === '_') && selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        openQuickModal(items[selectedIndex].id, 'subtract');
                    } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        deleteItem(items[selectedIndex].id);
                    }
                }
            });
        }

        function initSupabase() {
            const url = localStorage.getItem('veg_supabase_url');
            const key = localStorage.getItem('veg_supabase_key');

            if (url && key) {
                try {
                    supabaseClient = supabase.createClient(url.trim(), key.trim(), {
                        auth: { persistSession: false }
                    });
                    document.getElementById('statusText').innerText = "Облакът е свързан (Активен)";
                    document.getElementById('statusBar').className = "bg-emerald-50 border-b border-emerald-200 text-emerald-800 text-xs px-4 py-2 flex justify-between items-center";
                } catch (e) {
                    document.getElementById('statusText').innerText = "Грешка в ключовете!";
                    document.getElementById('statusBar').className = "bg-red-50 border-b border-red-200 text-red-800 text-xs px-4 py-2 flex justify-between items-center";
                    supabaseClient = null;
                }
            } else {
                document.getElementById('statusText').innerText = "Офлайн (Само локално)";
                document.getElementById('statusBar').className = "bg-amber-50 border-b border-amber-200 text-amber-800 text-xs px-4 py-2 flex justify-between items-center";
                supabaseClient = null;
            }
        }

        function openConfigModal() {
            document.getElementById('cfgUrl').value = localStorage.getItem('veg_supabase_url') || '';
            document.getElementById('cfgKey').value = localStorage.getItem('veg_supabase_key') || '';
            document.getElementById('configModal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
        }

        function saveConfig() {
            const url = document.getElementById('cfgUrl').value.trim();
            const key = document.getElementById('cfgKey').value.trim();

            if (url) localStorage.setItem('veg_supabase_url', url);
            else localStorage.removeItem('veg_supabase_url');

            if (key) localStorage.setItem('veg_supabase_key', key);
            else localStorage.removeItem('veg_supabase_key');

            closeConfigModal();
            initSupabase();
            loadItems();
        }

        async function loadItems() {
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('veg_items')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!error && data) {
                        items = data;
                        renderList();
                        return;
                    }
                } catch (e) {}
            }

            const local = localStorage.getItem('veg_local_items');
            items = local ? JSON.parse(local) : [];
            renderList();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const typeInput = document.getElementById('productType');
            const nameInput = document.getElementById('productName');
            const qtyInput = document.getElementById('productQty');
            const unitInput = document.getElementById('productUnit');

            const type = typeInput.value;
            const name = nameInput.value.trim().toLowerCase();
            const qty = parseFloat(qtyInput.value);
            const unit = unitInput.value;

            if (!name || isNaN(qty)) return;

            // Ищем совпадение ТОЛЬКО по названию (без жесткой привязки к таре)
            const existingItem = items.find(item => item.name.toLowerCase() === name);

            if (supabaseClient) {
                if (existingItem) {
                    const newQty = parseFloat((existingItem.qty + qty).toFixed(2));
                    // Обновляем количество, время, а также при необходимости обновляем тару и тип
                    await supabaseClient.from('veg_items').update({ 
                        qty: newQty, 
                        unit: unit,
                        type: type,
                        created_at: new Date().toISOString() 
                    }).eq('id', existingItem.id);
                } else {
                    const newItem = { id: Date.now().toString(), name: name, qty: qty, unit: unit, type: type, is_ordered: false, created_at: new Date().toISOString() };
                    await supabaseClient.from('veg_items').insert([newItem]);
                }
            } else {
                if (existingItem) {
                    existingItem.qty = parseFloat((existingItem.qty + qty).toFixed(2));
                    existingItem.unit = unit;
                    existingItem.type = type;
                    existingItem.created_at = new Date().toISOString();
                } else {
                    items.unshift({ id: Date.now().toString(), name: name, qty: qty, unit: unit, type: type, is_ordered: false, created_at: new Date().toISOString() });
                }
                localStorage.setItem('veg_local_items', JSON.stringify(items));
            }

            nameInput.value = '';
            qtyInput.value = '';
            nameInput.focus();
            await loadItems();
        }

        async function toggleItemType(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const newType = (item.type === 'drive') ? 'warehouse' : 'drive';

            if (supabaseClient) {
                await supabaseClient.from('veg_items').update({ type: newType }).eq('id', id);
            } else {
                item.type = newType;
                localStorage.setItem('veg_local_items', JSON.stringify(items));
            }
            await loadItems();
        }

        async function toggleItemOrdered(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const newOrderedStatus = !item.is_ordered;

            if (supabaseClient) {
                await supabaseClient.from('veg_items').update({ is_ordered: newOrderedStatus }).eq('id', id);
            } else {
                item.is_ordered = newOrderedStatus;
                localStorage.setItem('veg_local_items', JSON.stringify(items));
            }
            await loadItems();
        }

        function openQuickModal(id, mode) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            activeItemId = id;
            activeMode = mode;

            document.getElementById('quickModalTitle').innerText = mode === 'add' ? "Прибави (+)" : "Извади (-)";
            document.getElementById('quickModalSubtitle').innerText = `${item.name} (${item.unit})`;
            document.getElementById('quickModalQty').value = '';
            document.getElementById('quickModal').classList.remove('hidden');
            document.getElementById('quickModalQty').focus();
        }

        function closeQuickModal() {
            document.getElementById('quickModal').classList.add('hidden');
            activeItemId = null;
        }

        async function applyQuickAction() {
            const val = parseFloat(document.getElementById('quickModalQty').value);
            if (isNaN(val) || !activeItemId) return;

            const item = items.find(i => i.id === activeItemId);
            if (item) {
                let newQty = activeMode === 'add' ? item.qty + val : item.qty - val;
                newQty = parseFloat(newQty.toFixed(2));

                if (newQty <= 0) {
                    await deleteItem(item.id);
                } else {
                    if (supabaseClient) {
                        await supabaseClient.from('veg_items').update({ qty: newQty }).eq('id', item.id);
                    } else {
                        item.qty = newQty;
                        localStorage.setItem('veg_local_items', JSON.stringify(items));
                    }
                }
            }
            closeQuickModal();
            await loadItems();
        }

        async function deleteItem(id) {
            const item = items.find(i => i.id === id);
            const itemName = item ? item.name : 'тази позиция';

            const confirmed = confirm(`Сигурни ли сте, че искате да изтриете "${itemName}"?`);
            if (!confirmed) return;

            if (supabaseClient) {
                await supabaseClient.from('veg_items').delete().eq('id', id);
            } else {
                items = items.filter(i => i.id !== id);
                localStorage.setItem('veg_local_items', JSON.stringify(items));
            }
            if (selectedIndex >= items.length) selectedIndex = items.length - 1;
            await loadItems();
        }

        function renderList() {
            const container = document.getElementById('itemsList');
            const itemCount = document.getElementById('itemCount');

            container.innerHTML = '';
            itemCount.innerText = `${items.length} позиции`;

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">Няма намерени записи.</div>`;
                return;
            }

            items.forEach((item, index) => {
                const card = document.createElement('div');
                const isSelected = index === selectedIndex;
                card.className = `bg-white p-3 rounded-xl border transition flex items-center justify-between ${
                    isSelected ? 'item-selected border-emerald-500 shadow-md' : 'border-gray-100 hover:border-emerald-200 shadow-sm'
                }`;
                card.onclick = () => { selectedIndex = index; renderList(); };
                
                const timeStr = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const itemType = item.type || 'warehouse';
                const isOrdered = item.is_ordered || false;

                const typeBadgeHtml = itemType === 'drive'
                    ? `<button onclick="event.stopPropagation(); toggleItemType('${item.id}')" title="Нажмите, чтобы сменить на Склад" class="w-8 h-8 rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200 transition flex items-center justify-center font-bold text-sm shrink-0">
                        <i class="fa-solid fa-truck"></i>
                       </button>`
                    : `<button onclick="event.stopPropagation(); toggleItemType('${item.id}')" title="Нажмите, чтобы сменить на Ехать" class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 transition flex items-center justify-center font-bold text-sm shrink-0">
                        <i class="fa-solid fa-warehouse"></i>
                       </button>`;

                const orderBadgeHtml = isOrdered
                    ? `<button onclick="event.stopPropagation(); toggleItemOrdered('${item.id}')" title="Заказано (Нажмите, чтобы отменить)" class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 hover:bg-emerald-200 border border-emerald-300 transition flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-check text-xs font-bold"></i>
                       </button>`
                    : `<button onclick="event.stopPropagation(); toggleItemOrdered('${item.id}')" title="Не заказано (Нажмите, чтобы отметить)" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-100 border border-rose-200 transition flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-xmark text-xs font-bold"></i>
                       </button>`;

                card.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 pr-2">
                        ${typeBadgeHtml}
                        <div class="min-w-0">
                            <div class="font-semibold ${isOrdered ? 'text-gray-400 line-through' : 'text-gray-800'} capitalize text-sm truncate">
                                ${item.name}
                            </div>
                            <div class="text-[10px] text-gray-400">${timeStr} • ${itemType === 'drive' ? 'Ехать' : 'Склад'}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        ${orderBadgeHtml}
                        <div class="text-right mr-1">
                            <span class="font-bold text-gray-800 text-base">${item.qty}</span>
                            <span class="text-xs text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-medium">${item.unit}</span>
                        </div>
                        <button onclick="event.stopPropagation(); openQuickModal('${item.id}', 'add')" class="w-7 h-7 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                        <button onclick="event.stopPropagation(); openQuickModal('${item.id}', 'subtract')" class="w-7 h-7 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-minus text-xs"></i>
                        </button>
                        <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="w-7 h-7 bg-red-50 hover:bg-red-100 text-red-500 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
